name: PostgreSQL backup

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/keyrings/postgresql.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create encrypted database dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          mkdir -p backup
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version
          "$PG_DUMP" "$BACKUP_DATABASE_URL" --format=custom --no-owner --no-privileges > backup/pinakes-$(date -u +%Y-%m-%d).dump
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup/pinakes-*.dump \
            -out backup/pinakes-$(date -u +%Y-%m-%d).dump.enc \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm backup/pinakes-*.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup/*.dump.enc
          retention-days: 30
